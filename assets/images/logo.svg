<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3a712" />
      <stop offset="100%" stop-color="#ffc857" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec4b6" />
      <stop offset="100%" stop-color="#a0f2e3" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Inner circular glow -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#tealGrad)" stroke-width="2" stroke-dasharray="10 15" opacity="0.3" />
  
  <g transform="translate(64, 64)">
    <!-- Shield Outline -->
    <path d="M192 10 L320 10 L384 122 L320 234 L192 234 L128 122 Z" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round" opacity="0.25" transform="scale(0.8) translate(50, 50)" />
    
    <!-- Outer tracking lines (waves) -->
    <path d="M110 210 A 130 130 0 0 1 274 90" fill="none" stroke="url(#tealGrad)" stroke-width="12" stroke-linecap="round" opacity="0.5" />
    <path d="M90 230 A 160 160 0 0 1 294 70" fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round" opacity="0.3" />
    
    <!-- 3D Cargo Box -->
    <!-- Front Left Face -->
    <path d="M192 165 L192 270 L274 315 L274 210 Z" fill="#134074" stroke="url(#accentGrad)" stroke-width="6" stroke-linejoin="round" />
    <!-- Front Right Face -->
    <path d="M274 210 L274 315 L356 270 L356 165 Z" fill="#0d2c54" stroke="url(#accentGrad)" stroke-width="6" stroke-linejoin="round" />
    <!-- Top Face -->
    <path d="M192 165 L274 210 L356 165 L274 120 Z" fill="url(#accentGrad)" stroke="url(#accentGrad)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- High-tech cross hairs / scanner beam -->
    <path d="M162 210 L386 210" fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" stroke-dasharray="6 6" />
    <!-- Radar Target Circle -->
    <circle cx="274" cy="210" r="45" fill="none" stroke="url(#tealGrad)" stroke-width="8" />
    <circle cx="274" cy="210" r="12" fill="#2ec4b6" />
  </g>
</svg>
